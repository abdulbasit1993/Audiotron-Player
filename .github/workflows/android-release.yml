name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_NAME="AudiotronPlayer"

          mv android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/${APP_NAME}-${TAG}.apk"

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/release/

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/AudiotronPlayer-${{ github.ref_name }}.apk
          generate_release_notes: true
